name: Generate Snake Animation

on:
  # Permite ejecutar el workflow automáticamente cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:
  
  # Se ejecuta automáticamente con cada push a la rama principal
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Genera los archivos SVG de la serpiente usando las contribuciones del usuario
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publica los SVG generados en la rama "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
